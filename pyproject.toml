[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maho-harness"
version = "0.1.0b1"
description = "Evidence-first, model-agnostic engineering governance for coding agents"
readme = "README.en.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "MAHO contributors" }
]
keywords = ["agentic-engineering", "agent-skills", "codex", "software-governance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
maho = "harness.cli:main"
engineering-harness = "harness.cli:main"

[project.urls]
Documentation = "https://github.com/Do-fei/maho-harness#readme"
Issues = "https://github.com/Do-fei/maho-harness/issues"
Source = "https://github.com/Do-fei/maho-harness"

[tool.setuptools]
packages = ["harness"]
include-package-data = true

[tool.setuptools.package-data]
harness = ["assets/**/*"]

[tool.unittest]
start-directory = "tests"
